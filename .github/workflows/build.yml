name: build
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - run: unzip -q "$(ls -1 *.zip | head -n1)"
      - run: chmod +x gradlew && ./gradlew build --no-daemon
        working-directory: dinobreeding
      - run: gh release create "v${{ github.run_number }}" dinobreeding/build/libs/*.jar -t "Build ${{ github.run_number }}" -n "dinobreeding"
        env:
          GH_TOKEN: ${{ github.token }}
